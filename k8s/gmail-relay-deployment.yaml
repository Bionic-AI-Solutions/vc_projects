apiVersion: v1
kind: ConfigMap
metadata:
  name: gmail-relay-config
  namespace: vc-tools
data:
  # Gmail SMTP Relay Configuration
  RELAY_HOST: "[smtp-relay.gmail.com]:587"
  RELAY_PORT: "587"
  # If using Google Workspace, configure allowed sender domains
  ALLOWED_SENDER_DOMAINS: "bionicaisolutions.com"
  # Relay networks (allow from pods in cluster)
  RELAY_NETWORKS: "10.0.0.0/8"
---
apiVersion: v1
kind: Secret
metadata:
  name: gmail-relay-secret
  namespace: vc-tools
type: Opaque
stringData:
  # Gmail SMTP credentials (if authentication is required)
  # For Google Workspace SMTP relay, you may need app-specific password
  RELAY_USERNAME: ""  # Leave empty if using IP-based authentication
  RELAY_PASSWORD: ""  # Leave empty if using IP-based authentication
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gmail-relay
  namespace: vc-tools
  labels:
    app: gmail-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gmail-relay
  template:
    metadata:
      labels:
        app: gmail-relay
    spec:
      containers:
      - name: postfix-relay
        # Using a lightweight Postfix SMTP relay image
        image: boky/postfix:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 587
          name: smtp
          protocol: TCP
        env:
        # Relay host configuration
        - name: RELAYHOST
          valueFrom:
            configMapKeyRef:
              name: gmail-relay-config
              key: RELAY_HOST
        - name: RELAYHOST_PORT
          valueFrom:
            configMapKeyRef:
              name: gmail-relay-config
              key: RELAY_PORT
        # Authentication (optional - depends on Gmail setup)
        - name: RELAYHOST_USERNAME
          valueFrom:
            secretKeyRef:
              name: gmail-relay-secret
              key: RELAY_USERNAME
              optional: true
        - name: RELAYHOST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gmail-relay-secret
              key: RELAY_PASSWORD
              optional: true
        # Allowed sender domains
        - name: ALLOWED_SENDER_DOMAINS
          valueFrom:
            configMapKeyRef:
              name: gmail-relay-config
              key: ALLOWED_SENDER_DOMAINS
        # Networks allowed to relay
        - name: MYNETWORKS
          valueFrom:
            configMapKeyRef:
              name: gmail-relay-config
              key: RELAY_NETWORKS
        # Use STARTTLS for Gmail
        - name: RELAYHOST_TLS_LEVEL
          value: "encrypt"
        # Force IPv4 only (cluster has no IPv6 route to internet)
        - name: POSTFIX_inet_protocols
          value: "ipv4"
        # Logging
        - name: LOG_LEVEL
          value: "info"
        # Disable local delivery, relay only
        - name: MESSAGE_SIZE_LIMIT
          value: "52428800"  # 50MB
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 587
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 587
          initialDelaySeconds: 5
          periodSeconds: 5
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: gmail-relay
  namespace: vc-tools
  labels:
    app: gmail-relay
spec:
  type: ClusterIP
  ports:
  - port: 25
    targetPort: 587
    protocol: TCP
    name: smtp
  selector:
    app: gmail-relay
