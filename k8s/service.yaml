apiVersion: v1
kind: Service
metadata:
  name: vc-tools
  namespace: vc-tools
  labels:
    app: vc-tools
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # For AWS
    # Kong service annotations for SSE support
    konghq.com/connect-timeout: "60000"
    konghq.com/read-timeout: "60000"
    konghq.com/write-timeout: "60000"
    konghq.com/protocol: "http"
spec:
  type: LoadBalancer
  selector:
    app: vc-tools
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
---
apiVersion: v1
kind: Service
metadata:
  name: vc-tools-headless
  namespace: vc-tools
  labels:
    app: vc-tools
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: vc-tools
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
