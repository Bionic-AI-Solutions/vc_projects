apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vc-tools

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

commonLabels:
  app: vc-tools
  managed-by: kustomize

images:
  - name: docker4zerocool/vc-tools
    newTag: latest
